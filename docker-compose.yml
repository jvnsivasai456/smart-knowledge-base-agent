version: '3.8'

services:
  api:
    build: .
    container_name: smart_kb_api
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/data/uploads
      - CHROMA_DB_DIR=/app/data/chroma_db
      - METADATA_DB_PATH=/app/data/metadata.sqlite
      - EMBEDDING_MODEL_NAME=all-MiniLM-L6-v2
      - SCHEDULER_INTERVAL_MINUTES=60
    volumes:
      - kb_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build: .
    container_name: smart_kb_ui
    ports:
      - "8501:8501"
    environment:
      - API_HOST=http://api:8000
    command: streamlit run src/ui/app.py --server.address 0.0.0.0 --server.port 8501
    volumes:
      - kb_data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  kb_data:
    name: smart_kb_data
